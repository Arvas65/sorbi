name: CI

# İş hattının Test adımının makine tarafı (docs/is-hatti/00-IS-HATTI.md § 7).
# Buradaki hiçbir adım gerçek bir LLM servisine ihtiyaç duymaz — CI, Ollama olmadan koşar.

on:
  push:
    # HER dal. Sebep (2026-08-21): depoda master dışında hiçbir şey yoktu ve
    # v3 işinin tamamı yalnız yerel diskte duruyordu — CI hiç koşmamıştı,
    # koşamazdı da. Dal listesini daraltmak, ilk yeşil CI koşumunu (BULGU-06)
    # "doğru dala push etmeyi hatırlamak" şartına bağlıyordu. Bağlamıyoruz.
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements/dev.txt
      - run: ruff check .

  test:
    name: Testler (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10: İhsan'ın yerel sanal ortamı · 3.11: Docker imajı · 3.13: ileriye dönük kontrol
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Yalnız core + dev kurulur: RAG katmanı (torch) CI'da gereksiz.
      # schema_rag, Chroma yokken anahtar-kelime moduna düşer — bu davranış bilinçlidir.
      - name: Bağımlılıklar (core + dev)
        run: pip install -r requirements/core.txt -r requirements/dev.txt

      - name: Demo veritabanlarını üret
        run: |
          python demo/seed_data.py
          python demo/seed_satis.py

      - name: Birim testleri
        run: pytest tests/ --cov=app --cov=eval --cov-report=term-missing --cov-report=xml

      # G-11 önkoşulu: test setinin kendisi sağlıklı mı? LLM gerektirmez.
      - name: Test seti bütünlüğü (gold-only)
        run: python eval/evaluate.py --db demo/hospital.db --gold-only

      # B-7 mutasyon karnesi de LLM'siz koşar ve kendi geçmişiyle karşılaştırılır.
      # CI'da koşması, güven kontrollerinde bir gerilemenin gece koşumunu
      # beklemeden görülmesini sağlar (İP-33). Karne kendi eşiğini taşır:
      # kod değişmediği hâlde sayı düşerse `KARNE-GECMIS.log` farkı yazar.
      - name: Güven kontrolü mutasyon karnesi (LLM'siz)
        if: matrix.python-version == '3.11'
        run: python eval/guven_olcum.py

      - name: Kapsam raporunu sakla
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  docker:
    name: Docker imajı derlenir
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Derle (yayınlama yok)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sorbi:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: İmaj içinde demo veritabanları var mı
        run: docker run --rm sorbi:ci python -c "import os;assert os.path.exists('demo/hospital.db');print('demo DB tamam')"

  # --- Regresyon kapısı burada DEĞİL, gece koşumunda ---
  #
  # SPEC A-4'ün kapısı `eval/evaluate.py` içinde uygulandı (İP-33): eşli
  # McNemar kararı, REGRESYON çıkarsa **çıkış kodu 3**. Ama koşabilmesi için
  # bir LLM gerekiyor ve CI'da LLM yok (bilerek: bkz. yukarıdaki "yalnız core
  # + dev" notu). Bu yüzden kapı gece koşumunda, İhsan'ın makinesinde işler.
  #
  # Eşik neden 3 puan DEĞİL: ölçülen gürültü tabanı koşumlar arası 7 ayrık
  # soru (McNemar p = 1,000). Saf gürültüde |net| >= 3 soru çıkma olasılığı
  # ~%45; kapı hiçbir şey olmadan neredeyse her iki koşumda bir ateşlerdi.
  # Yeni kural: `bozulan - düzelen >= 3` VE `McNemar p < 0,05`.
  #
  # Burada koşan LLM'siz kapılar: ruff, testler, gold-only bütünlük,
  # B-7 mutasyon karnesi.
